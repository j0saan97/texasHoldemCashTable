<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Manos - Poker Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 400px;
            --filter-height: 180px;
        }

        body, html { height: 100%; overflow: hidden; background-color: #f4f7f6; }

        /* Contenedor de Filtros */
        .header-filters {
            height: var(--filter-height);
            background: #ffffff;
            border-bottom: 2px solid #dee2e6;
            padding: 20px;
            z-index: 100;
        }

        /* Layout Principal */
        .app-layout {
            display: flex;
            height: calc(100vh - var(--filter-height));
        }

        /* Columna de la lista (Donde irán los ManoComponent) */
        .sidebar-list {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 10px;
        }

        /* Visor de Imagen */
        .image-viewer {
            flex-grow: 1;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .image-viewer img {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            display: none; /* Se activará con JS/React */
        }

        .no-image-placeholder {
            color: #888;
            text-align: center;
        }

        .compact-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <header class="header-filters">
        <div class="container-fluid">
            <h5 class="mb-3">Filtros de Búsqueda</h5>
            <form id="filterForm" class="row g-3">
                <div class="col-md-2">
                    <label class="compact-label">Modalidad</label>
                    <select class="form-select form-select-sm" id="f_modalidad">
                        <option value="">Todas</option>
                        <option value="Cash">No Limit holdemn</option>
                        <option value="MTT">Pot Limit Omaha</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="compact-label">Variedad</label>
                    <select class="form-select form-select-sm" id="f_modalidad">
                        <option value="">MTT</option>
                        <option value="Cash">CASH</option>
                        <option value="MTT">SPIN AND GO</option>
                    </select>
                </div>

                <!-- El subtipo se refiere a cosas como Zoom, Rush, Hyper, PKO, ESTO RENDERIZA SEGÚN LA VARIEDAD ELEGIDA-->
                <div class="col-md-2">
                    <label class="compact-label">Subtipo</label>
                    <select class="form-select form-select-sm" id="f_modalidad">
                        <option value="">1</option>
                        <option value="Cash">2</option>
                        <option value="MTT">3</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="compact-label">Verificador (Coach)</label>
                    <select class="form-select form-select-sm" id="f_coach">
                        <option value="">Cualquiera</option>
                        </select>
                </div>

                <!--renderiza segun la variedad elegida, igual que hace el form del drag_and_drop-->
                <div class="col-md-2">
                    <label class="compact-label">Nivel / Stake</label>
                    <input type="text" class="form-control form-control-sm" id="f_stake" placeholder="Ej: NL500">
                </div>

                <div class="col-md-2">
                    <label class="compact-label">Estado de Revisión</label>
                    <select class="form-select form-select-sm" id="f_estado">
                        <option value="">Todos</option>
                        <option value="revisada">✓ Revisadas</option>
                        <option value="pendiente">⚠ Pendientes</option>
                    </select>
                </div>

                <fieldset class="border-0 p-0 text-center" style="max-width: 100%; overflow: hidden;">
                    <legend class="text-white-50 fw-normal mb-1" style="font-size: 0.6rem; letter-spacing: 1px; float: none; text-transform: uppercase;">
                        HERO POSITION
                    </legend>
                    
                    <select id="positionFilter" 
                            class="form-select form-select-sm text-center mx-auto" 
                            style="max-width: 90%; 
                                font-size: 0.75rem; 
                                padding-top: 2px; 
                                padding-bottom: 2px; 
                                height: auto; 
                                background-position: right 0.5rem center;">
                        
                        <option value="all" selected>ALL POSITIONS</option> 
                        
                        <optgroup label="Relativas" style="font-size: 0.7rem;">
                            <option value="IP">In Position (IP)</option>
                            <option value="OOP">Out of Position (OOP)</option>
                        </optgroup>
                        
                        <optgroup label="Específicas (9-Max)" style="font-size: 0.7rem;">
                            <option value="SB">SB</option>
                            <option value="BB">BB</option>
                            <option value="UTG">UTG</option>
                            <option value="UTG1">EP</option>
                            <option value="MP">MP</option>
                            <option value="MP1">LJ</option>
                            <option value="HJ">HJ</option>
                            <option value="CO">CO</option>
                            <option value="BTN">BU</option>
                        </optgroup>
                    </select>
                </fieldset>

                <div class="col-md-1 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-secondary btn-sm w-100">Limpiar</button>
                </div>

            </form>
        </div>
    </header>

    <main class="app-layout">
        
        <aside class="sidebar-list" id="react-hand-list-container">
            <div class="text-center py-5 text-muted">
                <div style="margin-top:10px">
                    <fieldset class="mb-4 border-0 p-0 text-center">
                        <legend class="text-white-50 fw-normal mb-2" style="font-size: 0.7rem; letter-spacing: 1px; float: none; text-transform: uppercase;">
                            Filtro por Fecha
                        </legend>
                        <select id="dateRangeType" class="form-select custom-poker-input text-center mx-auto" style="max-width: 90%;">
                            <option value="all" selected>All Dates</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="this_month">This Month</option>
                            <option value="this_year">This Year</option> 
                            <option value="since">Since Date...</option>
                            <option value="between">Between Dates...</option>
                        </select>
                        <div style="display:flex;flex-direction:column;align-items:center;margin-top:10px;">
                            <input type="date" id="fechaInicio"  style="max-width: 44%;">
                            <input type="date" id="fechaFin"style="max-width: 44%;">
                        </div>
                    </fieldset>
                </div>
                <button class="btn-send" id="btnBuscadorSend">Cargar Manos</button>
            </div>
        </aside>

        <section class="image-viewer" id="hand-image-viewer" style="display:flex;flex-direction:column">
            <div id="data_table_container">
                <table class="table">
                    <thead>
                        <th>ID</th>
                        <th>Modalidad</th>
                        <th>Variedad</th>
                        <th>Subtipo</th>
                        <th>Nivel</th>
                        <th>Tipo Rivel</th>
                        <th>Nota</th>
                        <th>Ruta</th>
                        <th>Fecha</th>
                    </thead>
                    <tbody>
                        <!-- Aquí se llenarán las filas de las manos desde el backend -->
                         <!--
                            <tr>
                                <td>1</td>
                                <td>Cash</td>
                                <td>Hold'em</td>
                                <td>Zoom</td>
                                <td>NL100</td>
                                <td>Regular</td>
                                <td>Mano complicada, revisar...</td>
                                <td>/path/to/hand1.png</td>
                                <td>2024-06-01</td>
                            </tr>
                         -->
                    </tbody>
                </table>
            </div>
            <div class="no-image-placeholder" id="placeholder-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-image mb-3" viewBox="0 0 16 16">
                    <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                    <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                </svg>
                <h4>Selecciona una mano de la lista</h4>
                <p>Haz clic en una mano para visualizar la captura y los detalles completos.</p>
            </div>

            <img src="" id="display-hand-image" alt="Captura de la mano">
        </section>

    </main>
    <script>
        document.getElementById('btnBuscadorSend').addEventListener('click', () => {

            fetch('http://localhost:3000/api/filter/hands', {
                method: 'GET'
            })
            .then(response => response.json())
            .then(result => {
                console.log("Respuesta del servidor:", result);

                // Inyectar el HTML generado
                document.getElementById('data_table_container').innerHTML = result.html;
            })
            .catch(error => {
                console.error("Error en el envío:", error);
                alert("No se pudo conectar con el servidor: " + error.message);
            });

        });
    </script>
</body>
</html>
