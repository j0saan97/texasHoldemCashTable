<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Manos - Poker Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .filter-section { background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 15px; }
        .main-container { height: calc(100vh - 120px); display: grid; grid-template-columns: 350px 1fr; }
        .hand-list { overflow-y: auto; border-right: 1px solid #dee2e6; background: white; }
        .hand-viewer { background: #343a40; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; color: white; overflow: hidden; }
        .hand-card { cursor: pointer; border-bottom: 1px solid #eee; padding: 10px; transition: 0.2s; }
        .hand-card:hover { background: #e9ecef; }
        .hand-card.active { border-left: 5px solid #0d6efd; background: #f0f7ff; }
        #fullImage { max-width: 100%; max-height: 80vh; object-fit: contain; border: 2px solid #555; border-radius: 8px; }
        .compact-label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: #666; }
        @media (max-width: 992px) {
            .main-container { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="filter-section">
    <div class="container-fluid">
        <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="compact-label">Modalidad</label>
                <select class="form-select form-select-sm" id="f_modalidad">
                    <option value="">Todas</option>
                    <option value="Cash">Cash</option>
                    <option value="MTT">MTT</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="compact-label">Verificador (Coach)</label>
                <select class="form-select form-select-sm" id="f_coach">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="compact-label">Buscar en Notas/Dudas</label>
                <input type="text" class="form-select-sm form-control" id="f_search" placeholder="Ej: 'Check-raise'...">
            </div>
            <div class="col-md-2">
                <label class="compact-label">Estado</label>
                <select class="form-select form-select-sm" id="f_verificado">
                    <option value="">Cualquiera</option>
                    <option value="1">Verificadas</option>
                    <option value="0">Pendientes</option>
                </select>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-sm btn-primary w-100" onclick="cargarManos()">Filtrar</button>
            </div>
        </form>
    </div>
</div>

<div class="main-container">
    <div class="hand-list" id="handList">
        </div>

    <div class="hand-viewer" id="handViewer">
        <div id="viewerPlaceholder">
            <h4 class="text-muted">Selecciona una mano para visualizarla</h4>
        </div>
        <img id="fullImage" src="" style="display:none;">
        <div id="handDetails" class="mt-3 w-100 px-4" style="display:none;">
            <div class="d-flex justify-content-between border-bottom pb-2">
                <h5 id="view_titulo">Detalle de la Mano</h5>
                <span id="view_fecha" class="badge bg-info text-dark"></span>
            </div>
            <p id="view_duda" class="mt-2 fst-italic text-warning"></p>
            <p id="view_notas" class="small"></p>
        </div>
    </div>
</div>

<script>
    let todasLasManos = [];

    async function cargarCoaches() {
        const res = await fetch('/api/usuarios');
        const usuarios = await res.json();
        const select = document.getElementById('f_coach');
        select.innerHTML = '<option value="">Todos los Coaches</option>';
        usuarios.forEach(u => {
            select.innerHTML += `<option value="${u.id}">${u.nombre}</option>`;
        });
    }

    async function cargarManos() {
        const res = await fetch('/api/manos/viewer');
        todasLasManos = await res.json();
        renderList(todasLasManos);
    }

    function renderList(manos) {
        const listContainer = document.getElementById('handList');
        listContainer.innerHTML = '';
        
        manos.forEach(mano => {
            const card = document.createElement('div');
            card.className = 'hand-card';
            card.onclick = () => verMano(mano, card);
            card.innerHTML = `
                <div class="d-flex justify-content-between">
                    <strong>${mano.modalidad} - ${mano.nivel_stake}</strong>
                    <small>${mano.fecha_creacion.split('T')[0]}</small>
                </div>
                <div class="small text-muted text-truncate">${mano.descripcion_texto || 'Sin notas'}</div>
                <div class="mt-1">
                    ${mano.jugador_verificado ? '<span class="badge bg-success">✓ Revisada</span>' : '<span class="badge bg-secondary">Pendiente</span>'}
                    <span class="badge bg-light text-dark border">${mano.nombre_verificador || 'N/A'}</span>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function verMano(mano, element) {
        // Quitar clase active de otros
        document.querySelectorAll('.hand-card').forEach(c => c.classList.remove('active'));
        element.classList.add('active');

        // Mostrar elementos del visor
        document.getElementById('viewerPlaceholder').style.display = 'none';
        const img = document.getElementById('fullImage');
        const details = document.getElementById('handDetails');
        
        img.style.display = 'block';
        img.src = `/uploads/${mano.url_imagen}`;
        
        details.style.display = 'block';
        document.getElementById('view_titulo').innerText = `${mano.modalidad} | ${mano.tipo_juego} | ${mano.nivel_stake}`;
        document.getElementById('view_fecha').innerText = mano.fecha_creacion.split('T')[0];
        document.getElementById('view_duda').innerText = `Duda: ${mano.duda || 'Ninguna'}`;
        document.getElementById('view_notas').innerText = `Notas: ${mano.descripcion_texto}`;
    }

    // Inicializar
    cargarCoaches();
    cargarManos();
</script>

</body>
</html>
