<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      body { background: #0f3b2e; display: flex; justify-content: center; padding: 20px; font-family: Arial, sans-serif; }
      section.hand-review { background: #145c43; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
      h3 { margin: 0 0 15px; text-align: center; }
      .selectors-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
      select { background: #0b3d2e; color: white; border: 1px solid #ffffff44; padding: 8px; border-radius: 6px; outline: none; cursor: pointer; width: 100%; margin-bottom: 5px; }
      .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0b3d2e; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ffffff22; }
      .check-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .drop-zone { border: 2px dashed #ffffff88; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 10px; transition: background 0.3s; }
      .drop-zone img { max-width: 100%; max-height: 220px; margin-top: 10px; border-radius: 6px; }
      .street-buttons { display: flex; gap: 6px; margin: 12px 0; }
      .street-buttons button { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #0b3d2e; color: white; font-weight: bold; cursor: pointer; border: 1px solid #ffffff22; }
      .street-buttons button:hover { background: #07291f; }
      textarea { width: 100%; box-sizing: border-box; height: 120px; resize: vertical; border-radius: 8px; border: none; padding: 10px; font-size: 14px; background: #eee; color: #333; }
      .btn-send { width: 100%; margin-top: 15px; padding: 12px; border-radius: 8px; border: none; background: #2ecc71; color: #0f3b2e; font-weight: bold; font-size: 16px; cursor: pointer; }
      .btn-send:hover { background: #27ae60; }
    </style>
  </head>

  <body>

    <section class="hand-review">
      <h3>Sube tu mano</h3>

      <div class="selectors-container">
        <select id="modalidad">
          <option value="" disabled selected hidden>Selecciona Modalidad...</option>
          <option value="NoLimitHoldem">NoLimitHoldem</option>
          <option value="PotLimitOmaha">PotLimitOmaha</option>
        </select>

        <select id="variedad">
          <option value="" disabled selected hidden>Selecciona Variedad...</option>
        </select>

        <select id="subtipo">
          <option value="" disabled selected hidden>Selecciona Subtipo...</option>
        </select>

        <select id="nivel">
          <option value="" disabled selected hidden>Nivel / Buy-in...</option>
        </select>

        <select id="tipoRival">
          <option value="" disabled selected hidden>Tipo Rival</option>
        </select>

        <textarea id="duda" placeholder="Escribe aquí tu duda sobre esta mano..." style="width: 100%; min-height: 100px; margin-top: 1rem; padding: 12px; background: #1a1a1a; color: #fff; border: 1px solid #ffffff22; border-radius: 8px; font-family: inherit; resize: vertical;"></textarea>
      </div>
      
      <!-- FILTRO POSICIÓN -->
      <section class="filters-panel" style="background: #0b3d2e; border-radius: 8px; border: 1px solid #ffffff22; max-width: 500px; margin: 0 auto; padding: 1.2rem;">    
          <fieldset class="border-0 p-0 text-center">
              <legend class="text-white-50 fw-normal mb-2" style="font-size: 0.7rem; letter-spacing: 1px; float: none; text-transform: uppercase;">
                  HERO POSITION
              </legend>
              <select id="positionFilter" class="form-select custom-poker-input text-center mx-auto" style="max-width: 90%;">
                  <option value="all" selected>ALL POSITION</option> 
                  <optgroup label="Relativas">
                      <option value="ALL Positions">ALL POSITION</option>
                      <option value="IP">In Position (IP)</option>
                      <option value="OOP">Out of Position (OOP)</option>
                  </optgroup>
                  <optgroup label="Específicas (9-Max)">
                      <option value="SB">SB</option>
                      <option value="BB">BB</option>
                      <option value="UTG">UTG</option>
                      <option value="UTG1">EP</option>
                      <option value="MP">MP</option>
                      <option value="MP1">LJ </option>
                      <option value="HJ">HJ</option>
                      <option value="CO">CO</option>
                      <option value="BTN">BU</option>
                  </optgroup>
              </select>
          </fieldset>
          <!--fin filtro posicion-->
      </section>

      <p style="font-size: 12px; margin-bottom: 5px; color: #aaa; font-weight: bold;">CATEGORIA</p>
      <div class="checkbox-grid" id="checkboxGrid"></div>

      <div class="drop-zone" id="dropZone">
        Arrastra la imagen aquí<br>o haz click
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div class="street-buttons">
        <button data-street="PREFLOP">Pre</button>
        <button data-street="FLOP">Flop</button>
        <button data-street="TURN">Turn</button>
        <button data-street="RIVER">River</button>
      </div>

      <textarea id="notes" placeholder="Describe la mano..."></textarea>
      <!-- ASOCIAR MANO A JUGADOR -->
      <div style="margin-top: 15px; background: #0b3d2e; border-radius: 8px; padding: 12px; border: 1px solid #ffffff22;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #aaa;">
          <input type="checkbox" id="asociarJugador"> Asociar mano a un jugador
        </label>
        <div id="loginMano" style="display:none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
          <input type="text"     id="nickJugador" placeholder="Tu nick"     style="background:#1a1a1a; color:#fff; border:1px solid #ffffff33; padding:8px; border-radius:6px; font-size:13px;">
          <input type="password" id="passJugador" placeholder="Tu password" style="background:#1a1a1a; color:#fff; border:1px solid #ffffff33; padding:8px; border-radius:6px; font-size:13px;">
        </div>
      </div>
      <button class="btn-send" id="btnSend">ENVIAR A BIBLIOTECA</button>
    </section>

    
   
    <script>
      const POKER_CONFIG = {
        modalidades: {
            'NoLimitHoldem': {
                'MTT': ['vanilla (sin bounty)', 'PKO', 'MisteryBounty', 'Hyper_PKO', 'Hyper_vanilla'],
                'CASH_GAME': ['6Max - SIN ANTE', '6Max - CON ANTE', '9max - SIN ANTE', '9max - CON ANTE', '9max - 200bb', 'ZOOM'],
                'SPIN_AND_GO': ['velocidad normal', 'NITRO']
            },
            'PotLimitOmaha': {
                'CASH_GAME': ['PLO 6Max', 'PLO 9Max', 'PLO ZOOM'],
                'MTT': ['PLO vanilla', 'PLO PKO'],
                'SPIN_AND_GO': ['PLO Spin']
            }
        },
        // Definición de niveles según tus requerimientos
        nivelesConfig: {
            'CASH_GAME': ["NL2", "NL5", "NL10", "NL25", "NL50", "NL100", "NL200", "NL400", "NL600", "NL1000"],
            'MTT': [2, 5, 10, 25, 50, 100, 200, 400, 600, 1000], // Se extraen del objeto BuyIn
            'SPIN_AND_GO': ["0.25", "0.50", "1", "2", "3", "5", "10", "20", "50", "100"]
        },
        tiposDeRival: ['Desconocido (Default)', 'Fish', 'Reg Agresivo', 'Nit', 'Whale / Ballena', 'Loco-Maniatico', 'Pagón'],
        clasificaciones: [
            { id: 1, name: 'ERRORES GRAVES' },
            { id: 2, name: 'MANOS TOP VALUE' },
            { id: 3, name: 'Pozos Grandes' },
            { id: 4, name: 'ERRORES PREFLOP' },
            { id: 5, name: 'Pozos 3beteados' },
            { id: 6, name: 'vs LOCO' },
            { id: 7, name: 'CALL-FOLD vs agresion' },
            { id: 8, name: 'DudaSize' },
            { id: 9, name: 'Inducimos' }
        ]
      };

      const modSelect = document.getElementById('modalidad');
      const varSelect = document.getElementById('variedad');
      const subSelect = document.getElementById('subtipo');
      const nivelSelect = document.getElementById('nivel');
      const rivalSelect = document.getElementById('tipoRival');
      const grid = document.getElementById('checkboxGrid');
      const textarea = document.getElementById("notes");
      const duda = document.getElementById("duda");
      const posicionHero = document.getElementById("positionFilter");

      document.getElementById('asociarJugador').addEventListener('change', function() {
          document.getElementById('loginMano').style.display = this.checked ? 'flex' : 'none';
      });

      function init() {
        POKER_CONFIG.tiposDeRival.forEach(r => {
            const opt = document.createElement('option');
            opt.value = r; opt.textContent = r;
            rivalSelect.appendChild(opt);
        });

        POKER_CONFIG.clasificaciones.forEach(c => {
            const label = document.createElement('label');
            label.className = 'check-item';
            label.innerHTML = `<input type="checkbox" value="${c.id}"> ${c.name}`;
            grid.appendChild(label);
        });
      }
      init();

      modSelect.addEventListener('change', function() {
        varSelect.innerHTML = '<option value="" disabled selected hidden>Selecciona Variedad...</option>';
        subSelect.innerHTML = '<option value="" disabled selected hidden>Selecciona Subtipo...</option>';
        nivelSelect.innerHTML = '<option value="" disabled selected hidden>Nivel / Buy-in...</option>';
        
        const variedades = POKER_CONFIG.modalidades[this.value];
        if (variedades) {
            Object.keys(variedades).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v.replace(/_/g, ' ');
                varSelect.appendChild(opt);
            });
        }
      });

      varSelect.addEventListener('change', function() {
        subSelect.innerHTML = '<option value="" disabled selected hidden>Selecciona Subtipo...</option>';
        nivelSelect.innerHTML = '<option value="" disabled selected hidden>Nivel / Buy-in...</option>';
        
        const variedadActual = this.value;
        const subtipos = POKER_CONFIG.modalidades[modSelect.value][variedadActual];
        
        // Llenar subtipos
        if (subtipos) {
            subtipos.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                subSelect.appendChild(opt);
            });
        }

        // Llenar niveles dinámicamente según la VARIEDAD
        const niveles = POKER_CONFIG.nivelesConfig[variedadActual];
        if (niveles) {
            niveles.forEach(n => {
                const opt = document.createElement('option');
                // Si es MTT, n es el valor del BuyIn, si no, es el string directo
                const valor = (variedadActual === 'MTT') ? n : n;
                const texto = (variedadActual === 'MTT') ? `Buy-in: $${n}` : n;
                opt.value = valor; 
                opt.textContent = texto;
                nivelSelect.appendChild(opt);
            });
        }
      });

      document.querySelectorAll(".street-buttons button").forEach(btn => {
        btn.addEventListener("click", () => {
          const tag = `[${btn.dataset.street}]`;
          if (!textarea.value.includes(tag)) {
            textarea.value += (textarea.value ? "\n\n" : "") + tag + "\n";
            textarea.focus();
          }
        });
      });

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      let selectedFile = null; // Variable para almacenar el archivo seleccionado

      // Manejar selección de archivo desde input
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
          selectedFile = fileInput.files[0];
          const reader = new FileReader();
          reader.onload = ev => dropZone.innerHTML = `<img src="${ev.target.result}">`;
          reader.readAsDataURL(selectedFile);
        }
      });

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.style.background = "#ffffff22"; });
      dropZone.addEventListener("dragleave", () => dropZone.style.background = "transparent");
      dropZone.addEventListener("drop", e => {
        e.preventDefault();
        dropZone.style.background = "transparent";
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
          selectedFile = file; // Guardar el archivo en la variable
          const reader = new FileReader();
          reader.onload = ev => dropZone.innerHTML = `<img src="${ev.target.result}">`;
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('btnSend').addEventListener('click', () => {
          // 1. Recogemos los datos básicos
          const selectedTypes = Array.from(document.querySelectorAll('.checkbox-grid input:checked')).map(cb => cb.value);

          // 2. Validación mínima
          if (!modSelect.value || !varSelect.value) {
              alert("Por favor, selecciona modalidad y variedad.");
              return;
          }

          // 3. Creamos FormData para enviar archivos e datos
          const formData = new FormData();
          // 2b. Recoger nick/pass si el jugador quiere asociar la mano
          const asociar  = document.getElementById('asociarJugador').checked;
          const nick     = asociar ? document.getElementById('nickJugador').value.trim() : '';
          const password = asociar ? document.getElementById('passJugador').value.trim() : '';

          formData.append('modalidad', modSelect.value);
          formData.append('variedad', varSelect.value);
          formData.append('subtipo', subSelect.value);
          formData.append('nivel', nivelSelect.value);
          formData.append('rival', rivalSelect.value);
          formData.append('notas', textarea.value);
          formData.append('categorias', JSON.stringify(selectedTypes));
          formData.append('duda', duda.value);
          formData.append('posicion', posicionHero.value);
          formData.append('nick',     nick);
          formData.append('password', password);

          // 4. Agregar imagen si existe
          if (selectedFile) {
            formData.append('foto_mano', selectedFile);
          }

          // 5. Envío al servidor (Node.js API)
          fetch('http://localhost:3000/api/manos/viewer', {
            method: 'POST',
            body: formData  // No necesitamos Content-Type, fetch lo pone automáticamente
          })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then(result => {
            console.log("Respuesta del servidor:", result);
            if (result.status === 'success') {
              alert("¡Mano guardada con éxito en la base de datos!");
              // Limpiar formulario después de envío exitoso
              textarea.value = '';
              selectedFile = null;
              fileInput.value = '';
              dropZone.innerHTML = '<p>Arrastra una imagen aquí o haz clic para seleccionar</p>';
              // Desmarcar checkboxes
              document.querySelectorAll('.checkbox-grid input:checked').forEach(cb => cb.checked = false);
            } else {
              alert("Error: " + result.message);
            }
          })
          .catch(error => {
            console.error("Error en el envío:", error);
            alert("No se pudo conectar con el servidor: " + error.message);
          });
  });
    </script>
      
  </body>
</html>
